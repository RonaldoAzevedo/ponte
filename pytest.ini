[pytest]
testpaths = tests
# Captura só no nível do Python. A captura padrão (fd) troca os handles da saída padrão
# entre um teste e outro; o Tcl de tests/test_splash.py guarda o handle antigo e, quando
# o Windows reaproveita o número para outro arquivo, lê o arquivo errado (config vazio ou
# "Can't find a usable init.tcl"). No .exe isso não acontece: ninguém troca a saída padrão.
addopts = --capture=sys
